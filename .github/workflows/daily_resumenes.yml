name: Daily Resumenes

# Genera diariamente, justo después de la descarga de transcripts, los resúmenes que falten en resumenes/ con el mismo detalle que los
# existentes. No genera ninguna síntesis cruzada (eso lo hace
# periodic_synthesis.yml por separado, cada ~15 días). Corre en el runner
# propio con la suscripción de Claude Code ya autenticada, sin coste de API.

on:
  # Encadenado a la descarga en vez de un cron una hora después: los cron de
  # GitHub llegan con horas de retraso y el orden no estaba garantizado.
  workflow_run:
    workflows: ["Daily Transcripts Download"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resumenes:
    runs-on: self-hosted

    steps:
      # Con workflow_run, sin ref explícita se podría quedar en el commit
      # anterior al push de los transcripts.
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Diagnóstico de cobertura
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "transcripts: $(ls transcripts/*.txt | wc -l)"
          echo "resumenes: $(ls resumenes/*.md | wc -l)"

      - name: Generar resúmenes con Claude Code
        timeout-minutes: 45
        run: |
          ~/.npm-global/bin/claude -p "/daily-resumenes" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Write,Bash,Glob,Grep,Skill"

      # Digest del día por Telegram (bot @PaquitosAgent_bot, solo sendMessage:
      # la sesión de Durbar en el VPS es la única que lee ese bot). Envía los
      # digests/ sin marcador .sent y respeta la franja de silencio de
      # 23:00-07:00 Madrid. Si falla, los resúmenes se commitean igual y el
      # digest queda pendiente para la siguiente ejecución.
      - name: Enviar digest por Telegram
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/send_digest.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resumenes/ digests/
          git diff --staged --quiet || \
            git commit -m "resumenes: generación diaria automática $(date -u +%Y-%m-%d)"
          # Otro workflow puede haber empujado a main mientras este corría:
          # rebase y reintento en vez de fallar con non-fast-forward.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
