name: Daily Market Update

on:
  schedule:
    - cron: "0 9 * * *"     # 9:00 UTC todos los días
  workflow_dispatch:          # permite lanzarlo manualmente

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      # continue-on-error para que un fallo en los transcripts no impida
      # publicar el dashboard. El job se marca en rojo igualmente en el último
      # step, así que el fallo sigue siendo visible.
      - name: Download transcripts
        id: transcripts
        continue-on-error: true
        env:
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        run: python3 download_transcripts.py

      - name: Generate chart & HTML
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_liquidity.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ fred_data.csv transcripts/
          git diff --staged --quiet || \
            git commit -m "dashboard: update $(date -u +%Y-%m-%d)"
          git push

      - name: Marcar el fallo de transcripts
        if: steps.transcripts.outcome == 'failure'
        run: |
          echo "::error::La descarga de transcripts falló. El dashboard sí se ha publicado."
          exit 1
