name: Daily Transcripts Download

on:
  schedule:
    - cron: "0 9 * * *"     # 9:00 UTC todos los días
  workflow_dispatch:          # permite lanzarlo manualmente
    inputs:
      videos_to_check:
        description: "Vídeos recientes a revisar por canal (backfill puntual)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install dependencies
        # venv persistente en el runner en vez de instalar sobre el Python del
        # sistema; GITHUB_PATH hace que los pasos siguientes usen su python3.
        run: |
          python3 -m venv ~/.venvs/market-dashboard
          ~/.venvs/market-dashboard/bin/pip install -q -r requirements.txt
          echo "$HOME/.venvs/market-dashboard/bin" >> "$GITHUB_PATH"

      - name: Download transcripts
        env:
          VIDEOS_TO_CHECK: ${{ github.event.inputs.videos_to_check || '3' }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        run: python3 download_transcripts.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          git diff --staged --quiet || \
            git commit -m "transcripts: update $(date -u +%Y-%m-%d)"
          # Otro workflow puede haber empujado a main mientras este corría:
          # rebase y reintento en vez de fallar con non-fast-forward.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
