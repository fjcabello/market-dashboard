name: Daily Transcripts Download

on:
  schedule:
    - cron: "0 9 * * *"     # 9:00 UTC todos los días
  workflow_dispatch:          # permite lanzarlo manualmente
    inputs:
      videos_to_check:
        description: "Vídeos recientes a revisar por canal (backfill puntual)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -r requirements.txt

      - name: Download transcripts
        env:
          VIDEOS_TO_CHECK: ${{ github.event.inputs.videos_to_check || '3' }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        run: python3 download_transcripts.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcripts/
          git diff --staged --quiet || \
            git commit -m "transcripts: update $(date -u +%Y-%m-%d)"
          git push
